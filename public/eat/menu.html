<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menu · Crane Nest</title><meta name="robots" content="noindex"><meta name="theme-color" content="#070d18">
<!-- ゲスト案内 (/g/部屋) の「Around us」から開く、近くのお店の 4 言語メニュー + 指さし注文。?shop=gyusen|petanko&l=en|zh|ko|ja -->
<style>
[hidden]{display:none!important}
/* Layout: a phone-width guest page in the Crane Nest guide's night-navy style; sticky category rail, menu rows, order tray, full-screen Japanese order card for staff. */
:root {
  --bg: #070d18;
  --bg2: #0c1628;
  --panel: rgba(14, 26, 46, .82);
  --line: rgba(120, 190, 255, .22);
  --line2: rgba(120, 190, 255, .12);
  --cyan: #7fd4ff;
  --gold: #f0c26a;
  --ember: #ff6b4a;          /* charcoal-grill ember, for GYUSEN accents */
  --text: #eaf3ff;
  --muted: #8fa8c6;
  --paper: #fbf7ef;          /* staff card */
  --ink: #1d1712;
  --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "PingFang SC", "Apple SD Gothic Neo", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: #03060c; color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.phone { max-width: 440px; margin: 0 auto; min-height: 100vh; background: radial-gradient(120% 50% at 50% -10%, #3a1a10 0%, #16233c 35%, var(--bg) 65%); position: relative; padding-bottom: 110px; }
.phone::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(var(--line2) 1px, transparent 1px), linear-gradient(90deg, var(--line2) 1px, transparent 1px); background-size: 32px 32px; -webkit-mask: linear-gradient(#000, transparent 420px); mask: linear-gradient(#000, transparent 420px); }
.pad { padding-inline: 16px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: rgba(7, 13, 24, .88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line2); }
.back { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.top h1 { margin: 0; font-size: 16px; flex: 1; min-width: 0; }
.langs { display: flex; gap: 4px; }
.langs button { width: 34px; height: 30px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 12px; font-weight: 700; color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--cyan); color: #04121f; border-color: var(--cyan); }

/* hero */
.hero { position: relative; padding: 18px 16px 6px; display: grid; gap: 10px; }
.shop { display: flex; gap: 14px; align-items: center; }
.seal { flex: none; width: 66px; height: 66px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(145deg, #2b1008, #120806); border: 1px solid rgba(255, 107, 74, .45); box-shadow: 0 0 24px -6px rgba(255, 107, 74, .6); font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 800; font-size: 26px; color: #ff4f3a; letter-spacing: -2px; }
.shop h2 { margin: 0; font-size: 22px; letter-spacing: .04em; }
.shop h2 small { display: block; font-size: 12px; color: var(--muted); letter-spacing: .02em; font-weight: 500; margin-top: 2px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { font-size: 11.5px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
.fact b { color: var(--text); font-weight: 600; }
.shops { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.shops button { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 8px 10px; text-align: left; font-size: 13px; font-weight: 700; color: var(--muted); }
.shops button small { display: block; font-weight: 500; font-size: 11px; }
.shops button[aria-pressed="true"] { border-color: var(--ember); color: #fff; background: rgba(255, 107, 74, .14); }
.seal.okono { color: #f0c26a; border-color: rgba(240, 194, 106, .5); box-shadow: 0 0 24px -6px rgba(240, 194, 106, .55); font-size: 22px; letter-spacing: 0; }
.how { font-size: 12.5px; line-height: 1.6; color: var(--muted); margin: 0; }

/* category rail */
.rail { position: sticky; top: calc(51px + env(safe-area-inset-top, 0px)); z-index: 15; display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; background: rgba(7, 13, 24, .92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.rail button { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 12px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.rail button[aria-pressed="true"] { border-color: var(--ember); color: #fff; background: rgba(255, 107, 74, .16); }

/* sections + rows */
.sec { padding: 14px 16px 4px; scroll-margin-top: 110px; }
.sec h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .12em; color: var(--gold); display: flex; align-items: baseline; gap: 8px; text-transform: uppercase; }
.sec h3 small { letter-spacing: 0; color: var(--muted); font-weight: 500; text-transform: none; font-size: 11.5px; }
.list { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 11px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line2); }
.item.rec { border-color: rgba(240, 194, 106, .45); }
.item.in { border-color: var(--cyan); box-shadow: 0 0 0 1px rgba(127, 212, 255, .25) inset; }
.name { min-width: 0; }
.name b { font-size: 15px; line-height: 1.35; display: block; }
.name .ja { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.price { text-align: right; font-family: var(--mono); font-weight: 600; font-size: 14px; color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }
.desc { grid-column: 1 / -1; font-size: 12.5px; line-height: 1.55; color: #c3d3ea; margin: 0; }
.tags { grid-column: 1; display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; background: rgba(120, 190, 255, .1); color: var(--muted); }
.tag.hot { background: rgba(255, 107, 74, .16); color: #ffb3a3; }
.tag.star { background: rgba(240, 194, 106, .16); color: var(--gold); }
.tag.res { background: rgba(127, 212, 255, .16); color: var(--cyan); }
.ctrl { grid-column: 2; grid-row: span 2; align-self: end; display: flex; align-items: center; gap: 6px; }
.ctrl button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg2); font-size: 18px; line-height: 1; display: grid; place-items: center; }
.ctrl .add { background: var(--cyan); color: #04121f; border-color: var(--cyan); font-weight: 700; }
.ctrl .n { min-width: 16px; text-align: center; font-family: var(--mono); font-weight: 600; }
.opts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.opts button { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 6px 10px; font-size: 12.5px; color: var(--text); }
.opts button .pp { color: var(--gold); font-family: var(--mono); margin-left: 4px; }
.opts button .q { margin-left: 6px; background: var(--cyan); color: #04121f; border-radius: 999px; padding: 0 6px; font-weight: 700; font-size: 11px; }
/* 選んだサイズは「− 数 +」で増やす・減らす */
.og { display: inline-flex; align-items: stretch; border: 1px solid var(--cyan); border-radius: 10px; overflow: hidden; }
.og button { border: 0; border-radius: 0; }
.og .om { min-width: 40px; font-size: 18px; font-weight: 800; color: var(--cyan); background: rgba(127, 212, 255, .12); border-right: 1px solid var(--line); }
.note { margin: 16px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line); font-size: 12px; line-height: 1.6; color: var(--muted); }

/* tray */
.tray { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: min(440px, 100%); z-index: 30; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, transparent, rgba(3, 6, 12, .96) 30%); }
.tray button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 0; border-radius: 16px; padding: 14px 16px; background: linear-gradient(90deg, #ff6b4a, #f0a04a); color: #1a0703; font-weight: 800; font-size: 15px; box-shadow: 0 10px 30px -10px rgba(255, 107, 74, .8); }
.tray button:disabled { background: #1a2740; color: var(--muted); box-shadow: none; }
.tray .sum { font-family: var(--mono); }
.tray { display: flex; gap: 8px; }
.tray #clrBtn { width: auto; flex: 0 0 auto; padding: 14px 14px; background: #1a2740; color: #cfe0f5; border: 1px solid var(--line); box-shadow: none; font-weight: 700; }

/* staff card */
.staff { position: fixed; inset: 0; z-index: 60; background: var(--paper); color: var(--ink); overflow-y: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(24px + env(safe-area-inset-bottom, 0px)); }
.staff .inner { max-width: 440px; margin: 0 auto; display: grid; gap: 14px; }
.staff .hint { font-size: 12px; color: #7a6a5a; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.staff .hint button { border: 1px solid #d6c8b5; background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; color: var(--ink); }
.staff h2 { margin: 0; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 28px; line-height: 1.35; }
.staff h2 small { display: block; font-family: var(--sans); font-size: 13px; color: #7a6a5a; font-weight: 500; margin-top: 4px; }
.olist { display: grid; gap: 0; border-top: 2px solid var(--ink); }
.orow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 2px; border-bottom: 1px solid #e3d8c7; align-items: baseline; }
.orow b { font-size: 22px; line-height: 1.3; }
.orow .qty { font-size: 26px; font-weight: 800; font-family: var(--mono); color: #c0301c; }
.orow .sub { grid-column: 1 / -1; font-size: 12px; color: #7a6a5a; }
.total { display: flex; justify-content: space-between; font-size: 15px; padding: 4px 2px; }
.total b { font-family: var(--mono); font-size: 18px; }
.phr h4 { margin: 0 0 8px; font-size: 13px; color: #7a6a5a; font-weight: 600; }
.phrases { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.phrases button { border: 1px solid #d6c8b5; background: #fff; border-radius: 12px; padding: 10px; text-align: left; font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.35; }
.phrases button small { display: block; font-size: 11px; font-weight: 500; color: #7a6a5a; }
.big { position: fixed; inset: 0; z-index: 70; background: var(--paper); display: grid; place-items: center; padding: 24px; text-align: center; }
.big p { margin: 0; font-size: clamp(32px, 11vw, 54px); font-weight: 800; line-height: 1.3; color: var(--ink); }
.big small { display: block; margin-top: 18px; font-size: 14px; color: #7a6a5a; }
@media (prefers-reduced-motion: no-preference) { .item.in { transition: border-color .2s; } }
</style></head><body>

<div class="phone">
  <div class="top">
    <button class="back" type="button" id="back">‹ Around us</button>
    <h1 id="topTitle"></h1>
    <div class="langs" id="langs"></div>
  </div>

  <section class="hero">
    <div class="shops" id="shops" role="group" aria-label="Shop" hidden></div>
    <div class="shop">
      <div class="seal" id="seal" aria-hidden="true"></div>
      <h2><span id="shopName"></span><small id="kind"></small></h2>
    </div>
    <div class="facts" id="facts"></div>
    <p class="how" id="how"></p>
  </section>

  <nav class="rail" id="rail" aria-label="Menu sections"></nav>
  <div id="menu"></div>
  <div class="note" id="note"></div>
</div>

<div class="tray"><button type="button" id="clrBtn" hidden></button><button type="button" id="trayBtn" disabled></button></div>

<div class="staff" id="staff" hidden>
  <div class="inner">
    <div class="hint"><span id="staffHint"></span><button type="button" id="closeStaff"></button></div>
    <h2>ご注文をお願いします<small id="staffSub"></small></h2>
    <div class="olist" id="olist"></div>
    <div class="total"><span id="otlab">合計（目安）</span><b id="otot"></b></div>
    <div class="phr"><h4 id="phrTitle"></h4><div class="phrases" id="phrases"></div></div>
  </div>
</div>
<div class="big" id="big" hidden><div><p id="bigText"></p><small id="bigSub"></small></div></div>

<script>
// ---------- UI words ----------

        phr: "点一下，显示日语短句", note: "本菜单由 Crane Nest 根据店内菜单翻译。价格和菜品可能变动。如有过敏，请在点餐前询问店员。",

// ---------- menu (from the shop's paper menu; all prices tax-included) ----------
// [id, section, ja, price | [[optJa, price, {en,zh,ko}],...], {en,zh,ko}, {en,zh,ko} desc|null, flags]

const GYU = [

  ["kaino", "beef", "カイノミ（希少部位）", 1880, T("Kainomi (rare flank cut)", "牛腹肉（稀有部位）", "카이노미 (희소 부위)"), T("A small cut near the flank. Tender with a rich beef flavor.", "靠近腹部的少量部位，柔软，牛肉味浓。", "옆구리 근처의 소량 부위. 부드럽고 진한 맛."), "b"],

const QS = new URLSearchParams(location.search);
let lang = "en";
try { const l = localStorage.getItem("eats-lang"); if (l && UI[l]) lang = l; } catch (e) {}
if (UI[QS.get("l")]) lang = QS.get("l"); // ゲスト案内で選んでいる言語を優先
let shopId = SHOPS[QS.get("shop")] ? QS.get("shop") : "gyusen";
const carts = { gyusen: new Map(), petanko: new Map() }; // key "id|opt" -> qty
const shop = () => SHOPS[shopId];
const cartNow = () => carts[shopId];
const $ = (id) => document.getElementById(id);
const yen = (n) => "¥" + n.toLocaleString("en-US");
const L3 = (o, ja) => (lang === "ja" ? ja : o[lang]);
const walkTxt = (m) => ({ en: `${m} min walk`, zh: `步行${m}分钟`, ko: `도보 ${m}분`, ja: `徒歩${m}分` })[lang];

function itemName(it) {
  return lang === "ja" ? it[2] : it[4][lang];
}
function flagsOf(it) { return (it[6] || "").split(" ").filter(Boolean); }
const isNoodle = (it) => it[1] === "noodle";

let render = function () {
  const u = UI[lang], S = shop();
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
  $("langs").innerHTML = LANGS.map(([k, l]) => `<button type="button" data-l="${k}" aria-pressed="${k === lang}">${l}</button>`).join("");
  $("shops").innerHTML = Object.entries(SHOPS).map(([k, x]) => `<button type="button" data-shop="${k}" aria-pressed="${k === shopId}">${x.name} ${x.jp}<small>${L3(x.kind, x.kindJa)}</small></button>`).join("");
  $("topTitle").textContent = S.name;
  $("seal").innerHTML = S.seal;
  $("seal").className = "seal " + S.sealClass;
  $("shopName").textContent = `${S.name} ${S.jp}`;
  $("kind").textContent = L3(S.kind, S.kindJa);
  $("facts").innerHTML = [`🚶 <b>${walkTxt(S.walk)}</b>`, `🔥 ${L3(S.style, S.styleJa)}`, `¥ ${L3(S.tax, S.taxJa)}`].map((f) => `<span class="fact">${f}</span>`).join("");
  $("how").textContent = u.how;
  $("note").textContent = u.note;
  $("rail").innerHTML = S.sections.map(([k, n], i) => `<button type="button" data-s="${k}" aria-pressed="${i === 0}">${n[lang]}</button>`).join("");

  const html = S.sections.map(([sec, n]) => {
    const items = sec === "pick" ? S.items.filter((it) => flagsOf(it).includes("star")) : S.items.filter((it) => it[1] === sec);
    const head = sec === "pick" ? `<h3>${n[lang]} <small>${u.pick.replace("★ ", "")}</small></h3>` : `<h3>${n[lang]}</h3>`;
    return `<section class="sec" id="s-${sec}">${head}<div class="list">${items.map((it) => row(it, sec)).join("")}</div></section>`;
  }).join("");
  $("menu").innerHTML = html;
  updateTray();
}

function row(it, sec) {
  const u = UI[lang];
  const f = flagsOf(it);
  const opts = Array.isArray(it[3]);
  const qtyAll = [...cartNow().entries()].filter(([k]) => k.split("|")[0] === it[0]).reduce((s, [, q]) => s + q, 0);
  const tags = [];
  if (f.includes("star") && sec !== "pick") tags.push(`<span class="tag star">★</span>`);
  if (f.includes("h")) tags.push(`<span class="tag hot">🌶 ${u.hot}</span>`);
  if (f.includes("r")) tags.push(`<span class="tag res">📞 ${u.res}</span>`);
  if (f.includes("l")) tags.push(`<span class="tag hot">${u.lim}</span>`);
  if (f.includes("pp")) tags.push(`<span class="tag">${u.pp}</span>`);
  const meat = [["p", "🐖"], ["b", "🐄"], ["c", "🐓"], ["s", "🦐"]].filter(([k]) => f.includes(k)).map(([, e]) => e).join("");
  if (meat) tags.unshift(`<span class="tag">${meat}</span>`);
  const desc = it[5] && lang !== "ja" ? `<p class="desc">${it[5][lang]}</p>` : "";
  const sub = lang === "ja" ? "" : `<div class="ja">${it[2]}</div>`;
  let priceTxt, ctrl = "", optHtml = "";
  if (opts) {
    const ps = [...new Set(it[3].map((o) => o[1]))];
    priceTxt = ps.length === 1 ? (it[3].length > 1 ? `${u.each} ` : "") + yen(ps[0]) : `${yen(Math.min(...ps))}–`;
    optHtml = `<div class="opts">${it[3].map((o, i) => {
      const k = `${it[0]}|${i}`; const q = cartNow().get(k) || 0;
      const label = lang === "ja" ? (isNoodle(it) ? it[2] + o[0] : (o[0] || it[2])) : (o[2][lang] || itemName(it));
      const add = `<button type="button" data-add="${k}">+ ${label}${ps.length > 1 ? `<span class="pp">${yen(o[1])}</span>` : ""}${q ? `<span class="q">${q}</span>` : ""}</button>`;
      return q ? `<span class="og"><button type="button" class="om" data-sub="${k}" aria-label="−">−</button>${add}</span>` : add;
    }).join("")}</div>`;
  } else {
    priceTxt = yen(it[3]);
    const k = `${it[0]}|`; const q = cartNow().get(k) || 0;
    ctrl = `<div class="ctrl">${q ? `<button type="button" data-sub="${k}" aria-label="−">−</button><span class="n">${q}</span>` : ""}<button type="button" class="add" data-add="${k}" aria-label="+">+</button></div>`;
  }
  return `<div class="item${f.includes("star") ? " rec" : ""}${qtyAll ? " in" : ""}">
    <div class="name"><b>${itemName(it)}</b>${sub}</div><div class="price">${priceTxt}</div>
    ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}${ctrl}${desc}${optHtml}</div>`;
}

function lines() {
  const out = [];
  for (const [k, q] of cartNow()) {
    if (!q) continue;
    const [id, oi] = k.split("|");
    const it = shop().items.find((x) => x[0] === id);
    let ja = it[2], price = it[3], local = itemName(it);
    if (oi !== "") {
      const o = it[3][+oi];
      price = o[1];
      if (o[0]) ja = isNoodle(it) ? it[2] + o[0] : `${it[2]}（${o[0]}）`;
      if (lang !== "ja" && o[2][lang]) local = `${itemName(it)} · ${o[2][lang]}`;
    }
    out.push({ ja, price, q, local });
  }
  return out;
}

let updateTray = function () {
  const u = UI[lang];
  const L = lines();
  const n = L.reduce((s, x) => s + x.q, 0);
  const sum = L.reduce((s, x) => s + x.q * x.price, 0);
  const b = $("trayBtn");
  b.disabled = !n;
  b.innerHTML = n ? `<span>${u.tray(n)}</span><span class="sum">${yen(sum)}</span>` : `<span>${u.tray0}</span>`;
}

function openStaff() {
  const u = UI[lang];
  const L = lines();
  $("staffHint").textContent = u.hint;
  $("closeStaff").textContent = u.close;
  $("staffSub").textContent = `${u.sub} · ${shop().jp}`;
  $("olist").innerHTML = L.map((x) => `<div class="orow"><b>${x.ja}</b><span class="qty">×${x.q}</span>${lang === "ja" ? "" : `<span class="sub">${x.local} · ${yen(x.price)}</span>`}</div>`).join("");
  $("otlab").textContent = shopId === "gyusen" ? "合計（税込・目安）" : "合計（目安）";
  $("otot").textContent = yen(L.reduce((s, x) => s + x.q * x.price, 0));
  $("phrTitle").textContent = u.phr;
  $("phrases").innerHTML = shop().phrases.map(([ja, t], i) => `<button type="button" data-p="${i}">${ja}${lang === "ja" ? "" : `<small>${t[lang]}</small>`}</button>`).join("");
  $("staff").hidden = false;
  $("staff").scrollTop = 0;
}

// ---------- events ----------
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.l) { lang = t.dataset.l; try { localStorage.setItem("eats-lang", lang); } catch (err) {} render(); return; }
  if (t.dataset.shop) { shopId = t.dataset.shop; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.add) { const c = cartNow(); c.set(t.dataset.add, (c.get(t.dataset.add) || 0) + 1); rerenderKeepScroll(); return; }
  if (t.dataset.sub) { const c = cartNow(); const q = (c.get(t.dataset.sub) || 0) - 1; if (q > 0) c.set(t.dataset.sub, q); else c.delete(t.dataset.sub); rerenderKeepScroll(); return; }
  if (t.dataset.s) {
    document.querySelectorAll("#rail button").forEach((b) => b.setAttribute("aria-pressed", b === t));
    const el = $("s-" + t.dataset.s);
    if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    return;
  }
  if (t.dataset.p !== undefined) {
    const [ja, tr] = shop().phrases[+t.dataset.p];
    $("bigText").textContent = ja;
    $("bigSub").textContent = lang === "ja" ? "タップで戻る" : `${tr[lang]} · tap to close`;
    $("big").hidden = false;
    return;
  }
});
$("trayBtn").addEventListener("click", openStaff);
$("closeStaff").addEventListener("click", () => ($("staff").hidden = true));
$("big").addEventListener("click", () => ($("big").hidden = true));

function rerenderKeepScroll() {
  const y = window.scrollY;
  const rail = $("rail").scrollLeft;
  const active = document.querySelector('#rail button[aria-pressed="true"]')?.dataset.s;
  render();
  window.scrollTo(0, y);
  $("rail").scrollLeft = rail;
  if (active) document.querySelectorAll("#rail button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.s === active));
}

// sample order so the first view shows how it works
// 選んだものは、このタブの中だけで覚えておく (地図に戻って開き直しても消えない)
// 3 時間さわらなければ消す (同じスマホで次の日に開いても、前の注文は残らない)
const CK = "eats-cart-" + shopId, KEEP_MS = 3 * 3600e3;
try { const v = JSON.parse(sessionStorage.getItem(CK) || "null"); if (v && Date.now() - v.at < KEEP_MS && Array.isArray(v.items)) v.items.forEach(([k, q]) => q > 0 && cartNow().set(k, q)); } catch (e) {}
const saveCart = () => { try { if (cartNow().size) sessionStorage.setItem(CK, JSON.stringify({ at: Date.now(), items: [...cartNow()] })); else sessionStorage.removeItem(CK); } catch (e) {} };
// 注文を全部消すボタン (選んでいるときだけ出る)
const CLR = { en: ["↺ Clear", "Clear all items?"], zh: ["↺ 清空", "要清空全部吗？"], ko: ["↺ 비우기", "모두 지울까요?"], ja: ["↺ リセット", "選んだものを全部消しますか？"] };
const _upd = updateTray; updateTray = function () { _upd(); saveCart(); const c = $("clrBtn"); c.hidden = !cartNow().size; c.textContent = CLR[lang][0]; };
$("clrBtn").addEventListener("click", () => { if (!confirm(CLR[lang][1])) return; cartNow().clear(); rerenderKeepScroll(); });
$("back").addEventListener("click", () => { if (history.length > 1 && document.referrer.startsWith(location.origin)) history.back(); else location.href = QS.get("from") || "/g/lounge?s=map"; });
const BACK = { en: "‹ Around us", zh: "‹ 周边", ko: "‹ 주변", ja: "‹ 周辺" };
const _render = render; render = function () { _render(); $("back").textContent = BACK[lang]; document.title = `${shop().name} ${shop().jp} · Menu`; };
render();
</script>
